<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulación de Autolavado — Carros en movimiento</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',sans-serif; background:#0f172a; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:1rem; }
  input[type=range]{ accent-color:#38bdf8; }
  select{ background:#1e293b; border:1px solid #475569; border-radius:.4rem; }
</style>
<base target="_blank">
</head>
<body class="text-slate-200 min-h-screen p-4 md:p-8">

<div class="max-w-7xl mx-auto">
  <header class="mb-5 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl md:text-3xl font-extrabold text-white">🚗 Simulación de Autolavado</h1>
      <p class="text-slate-400 text-sm mt-1">
        Estados: <span class="text-green-400 font-semibold">🟢 Libre</span> ·
        <span class="text-red-400 font-semibold">🔴 Ocupado</span> ·
        <span class="text-yellow-400 font-semibold">🟡 Bloqueado</span>
      </p>
    </div>
    <div class="flex gap-2">
      <button id="btnStart" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-white transition">▶ Iniciar</button>
      <button id="btnReset" class="px-5 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 font-bold text-white transition">↺ Reiniciar</button>
    </div>
  </header>

  <!-- CONTROLES -->
  <div class="card p-4 mb-5 grid grid-cols-1 md:grid-cols-4 gap-5">
    <div>
      <label class="text-xs font-semibold text-slate-400 uppercase">Tasa de llegada (veh/min)</label>
      <div class="flex items-center gap-3 mt-1">
        <input id="inpLambda" type="range" min="1" max="20" step="0.5" value="6" class="w-full">
        <span id="lblLambda" class="text-sky-400 font-bold w-10 text-right">6.0</span>
      </div>
    </div>
    <div>
      <label class="text-xs font-semibold text-slate-400 uppercase">Operaciones / estaciones</label>
      <div class="flex flex-wrap gap-3 mt-2 text-xs">
        <label>Aspirado <select id="selAspirado"><option>1</option><option selected>2</option><option>3</option></select></label>
        <label>Lavado <select id="selLavado"><option selected>1</option><option>2</option><option>3</option></select></label>
        <label>Secado <select id="selSecado"><option selected>1</option><option>2</option></select></label>
      </div>
    </div>
    <div>
      <label class="text-xs font-semibold text-slate-400 uppercase">Velocidad de simulación</label>
      <div class="flex items-center gap-2 mt-1">
        <button id="btnSlow" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold">−</button>
        <span id="lblSpeed" class="text-sky-400 font-bold w-16 text-center">×1</span>
        <button id="btnFast" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold">+</button>
      </div>
    </div>
    <div>
      <label class="text-xs font-semibold text-slate-400 uppercase">Precio / Tiempo simulado</label>
      <div class="mt-1 text-lg font-bold text-emerald-400">$<span id="lblPrice">8.00</span>
        <span class="text-slate-500 text-sm font-normal">· ⏱ <span id="lblClock" class="text-slate-300 font-mono">00:00</span></span></div>
    </div>
  </div>

  <!-- PISTA ANIMADA -->
  <div class="card p-2 mb-6">
    <canvas id="cv" class="w-full rounded-xl" style="height:340px; background:#16213a;"></canvas>
  </div>

  <!-- DASHBOARD -->
  <h2 class="text-xl font-bold text-white mb-3">📊 Dashboard</h2>
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
    <div class="card p-4"><div class="text-xs text-slate-400 uppercase">Total ingresos</div><div id="mIncome" class="text-2xl font-extrabold text-emerald-400 mt-1">$0.00</div></div>
    <div class="card p-4"><div class="text-xs text-slate-400 uppercase">Facturas totales</div><div id="mInvoices" class="text-2xl font-extrabold text-white mt-1">0</div></div>
    <div class="card p-4"><div class="text-xs text-slate-400 uppercase">En sistema</div><div id="mInSys" class="text-2xl font-extrabold text-sky-400 mt-1">0</div></div>
    <div class="card p-4"><div class="text-xs text-slate-400 uppercase">Cuello de botella</div><div id="mBtl" class="text-lg font-extrabold text-yellow-400 mt-1">—</div><div id="mBtlPct" class="text-xs text-slate-400">—</div></div>
    <div class="card p-4"><div class="text-xs text-slate-400 uppercase">Tiempo prom. servicio</div><div id="mAvgT" class="text-2xl font-extrabold text-white mt-1">0.0<span class="text-sm"> min</span></div></div>
    <div class="card p-4"><div class="text-xs text-slate-400 uppercase">Abandonos</div><div id="mLost" class="text-2xl font-extrabold text-red-400 mt-1">0</div></div>
  </div>

  <!-- UTILIZACIÓN -->
  <div class="card p-5">
    <h3 class="font-bold text-white mb-4">Utilización por estación (%)</h3>
    <div id="utilBars" class="space-y-4"></div>
  </div>
</div>

<script>
// ================== SIMULACIÓN DE AUTOLAVADO (carros en movimiento) ==================
const STAGE_NAMES = ["Llegada","Aspirado","Lavado","Secado"];
const SERVICE = { "Aspirado":[2,4], "Lavado":[4,7], "Secado":[2,3] }; // min
const PRICE = 8.0, MAX_QUEUE = 7;
const COLORS = ['#38bdf8','#f472b6','#a78bfa','#34d399','#fb923c','#facc15','#e879f9','#4ade80','#f87171','#22d3ee'];

let running=false, speed=1, simTime=0, nextArrival=0.5, carId=0;
let income=0, invoices=0, lost=0, serviceTimes=[];
let stages=[], cars=[];

const expR = l => -Math.log(1-Math.random())/l;
const uniR = (a,b)=> a+Math.random()*(b-a);
const fmt = t => { const m=Math.floor(t),s=Math.floor((t-m)*60); return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); };

// ---------- Layout ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
function resize(){
  const r = cv.getBoundingClientRect();
  cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener('resize', resize);

const L = { entryX:-50, exitX:0, laneY:150, qGap:42, stGap:78 };
function stageX(i){ const w = cv.getBoundingClientRect().width; return [w*0.10, w*0.36, w*0.62, w*0.86][i]; }
function stationPos(si, k, n){
  const x = stageX(si);
  const y0 = L.laneY - (n-1)*L.stGap/2;
  return { x, y: y0 + k*L.stGap };
}
function queuePos(si, qi){
  return { x: stageX(si) - 55 - qi*L.qGap, y: L.laneY };
}

// ---------- Modelo ----------
function buildStages(){
  stages = STAGE_NAMES.map(name=>({ name, queue:[], stations:[] }));
  stages[1].stations = Array.from({length:+selAspirado.value},()=>({car:null,blocked:false,activeTime:0}));
  stages[2].stations = Array.from({length:+selLavado.value},()=>({car:null,blocked:false,activeTime:0}));
  stages[3].stations = Array.from({length:+selSecado.value},()=>({car:null,blocked:false,activeTime:0}));
  renderUtilBars();
}
function newCar(){
  const c = { id:++carId, color:COLORS[carId%COLORS.length], x:L.entryX, y:L.laneY,
              tx:stageX(0), ty:L.laneY, state:'arriving', stage:0, svc:0, svcTotal:0, tIn:simTime, blocked:false };
  cars.push(c); stages[0].queue.push(c);
  return c;
}
function toQueue(c, si){ c.stage=si; c.state='toQueue'; c.blocked=false; const p=queuePos(si, stages[si].queue.indexOf(c)); c.tx=p.x; c.ty=p.y; }
function refreshQueues(si){ // recolocar cola cuando avanza
  stages[si].queue.forEach((c,i)=>{ const p=queuePos(si,i); c.tx=p.x; c.ty=p.y; if(c.state==='queued'){c.state='toQueue';} });
}
function tryServe(si){
  const st = stages[si];
  for(let k=0;k<st.stations.length;k++){
    const s = st.stations[k];
    if(!s.car && st.queue.length){
      const c = st.queue.shift(); refreshQueues(si);
      const p = stationPos(si,k,st.stations.length);
      c.tx=p.x; c.ty=p.y; c.state='toStation'; c.blocked=false; s.car=c; s.blocked=false;
    }
  }
}
function step(dt){
  // llegadas poisson
  while(simTime>=nextArrival){
    if(stages[0].queue.length < MAX_QUEUE) newCar(); else lost++;
    nextArrival = simTime + expR(+inpLambda.value);
  }
  // la recepción no tiene boxes: traslada su cola hacia Aspirado
  while(stages[0].queue.length && stages[1].queue.length<MAX_QUEUE){
    const c=stages[0].queue.shift();
    stages[1].queue.push(c); c.stage=1; c.state='toQueue'; c.blocked=false;
  }
  refreshQueues(0); refreshQueues(1);
  tryServe(1); tryServe(2); tryServe(3);
  for(let si=1; si<=3; si++){
    const st = stages[si];
    st.stations.forEach(s=>{
      const c = s.car; if(!c) { s.blocked=false; return; }
      if(c.state!=='service') return;
      s.activeTime += dt; c.svc -= dt;
      if(c.svc<=0){
        if(si<3){
          const nx = stages[si+1];
          const freeK = nx.stations.findIndex(x=>!x.car);
          if(freeK>=0 && nx.queue.length===0){
            // pasa directo a la estación libre
            s.car=null; s.blocked=false;
            const fs = nx.stations[freeK]; fs.car=c;
            const p = stationPos(si+1, freeK, nx.stations.length);
            c.tx=p.x; c.ty=p.y; c.state='toStation'; c.stage=si+1; c.blocked=false;
            const [a,b]=SERVICE[nx.name]; c.svcTotal=uniR(a,b); c.svc=c.svcTotal;
          } else if(nx.queue.length < MAX_QUEUE){
            s.car=null; s.blocked=false;
            nx.queue.push(c); toQueue(c, si+1); refreshQueues(si+1);
          } else {
            s.blocked=true; c.blocked=true; // 🟡 cuello de botella
          }
        } else {
          s.car=null; s.blocked=false;
          c.state='exit'; c.blocked=false;
          const w = cv.getBoundingClientRect().width;
          c.tx=w+80; c.ty=L.laneY - 20;
          invoices++; income+=PRICE; serviceTimes.push(simTime-c.tIn);
        }
      }
    });
    tryServe(si);
  }
  // movimiento de carros (visual)
  const v = 170; // px/s
  cars.forEach(c=>{
    const dx=c.tx-c.x, dy=c.ty-c.y, d=Math.hypot(dx,dy);
    if(d>1){ const mv=Math.min(d, v*dt); c.x+=dx/d*mv; c.y+=dy/d*mv; }
    else if(c.state==='arriving'||c.state==='toQueue'){ c.state='queued'; }
    else if(c.state==='toStation'){
      c.state='service';
      const [a,b]=SERVICE[stages[c.stage].name]; c.svcTotal=uniR(a,b); c.svc=c.svcTotal;
    }
  });
  cars = cars.filter(c=> !(c.state==='exit' && c.x > cv.getBoundingClientRect().width+60));
  simTime += dt;
}

// ---------- Dibujo ----------
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function drawStation(si,k,n,s){
  const {x,y} = stationPos(si,k,n);
  const w=58,h=58;
  let fill='#16a34a';
  if(s.car) fill = s.blocked ? '#eab308' : '#dc2626';
  ctx.save();
  ctx.shadowColor = s.car ? (s.blocked?'rgba(250,204,21,.6)':'rgba(239,68,68,.6)') : 'rgba(34,197,94,.5)';
  ctx.shadowBlur = 14;
  ctx.fillStyle = fill;
  roundRect(x-w/2,y-h/2,w,h,12); ctx.fill();
  ctx.restore();
  ctx.fillStyle='rgba(15,23,42,.85)';
  roundRect(x-w/2,y-h/2,w,h,12); ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.stroke();
  ctx.font='20px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(stages[si].name==='Lavado'?'🚿':stages[si].name==='Secado'?'🌬️':'🧽', x, y-6);
  if(s.car && s.car.state==='service' && s.car.svcTotal>0){
    const p = 1 - s.car.svc/s.car.svcTotal;
    ctx.fillStyle='rgba(255,255,255,.25)';
    roundRect(x-22,y+16,44,6,3); ctx.fill();
    ctx.fillStyle='#fff';
    roundRect(x-22,y+16,44*p,6,3); ctx.fill();
  }
  if(s.blocked){ ctx.font='bold 11px Inter'; ctx.fillStyle='#78350f'; ctx.fillText('BLOQUEADO', x, y+h/2+10); }
}
function drawCar(c){
  ctx.save(); ctx.translate(c.x,c.y);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0,10,16,4,0,0,7); ctx.fill();
  ctx.fillStyle=c.blocked && Math.floor(performance.now()/180)%2===0 ? '#fde047' : c.color;
  roundRect(-17,-8,34,14,5); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.75)';
  roundRect(-9,-12,18,8,3); ctx.fill();
  ctx.fillStyle='#0f172a';
  ctx.beginPath(); ctx.arc(-9,8,4,0,7); ctx.arc(9,8,4,0,7); ctx.fill();
  ctx.fillStyle='#94a3b8';
  ctx.beginPath(); ctx.arc(-9,8,1.6,0,7); ctx.arc(9,8,1.6,0,7); ctx.fill();
  ctx.restore();
}
function draw(){
  const w = cv.getBoundingClientRect().width, h = cv.getBoundingClientRect().height;
  ctx.clearRect(0,0,w,h);
  // carretera
  ctx.strokeStyle='#334155'; ctx.lineWidth=34; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-10,L.laneY); ctx.lineTo(w+10,L.laneY); ctx.stroke();
  ctx.strokeStyle='#64748b'; ctx.lineWidth=3; ctx.setLineDash([16,14]);
  ctx.beginPath(); ctx.moveTo(0,L.laneY); ctx.lineTo(w,L.laneY); ctx.stroke();
  ctx.setLineDash([]);
  // entrada / salida
  ctx.font='bold 13px Inter'; ctx.textAlign='center';
  ctx.fillStyle='#38bdf8'; ctx.fillText('⬅ ENTRADA', 55, L.laneY-32);
  ctx.fillStyle='#34d399'; ctx.fillText('SALIDA ➡', w-55, L.laneY-32);
  // etapas
  stages.forEach((st,si)=>{
    const x = stageX(si);
    ctx.font='bold 14px Inter'; ctx.fillStyle='#e2e8f0';
    ctx.fillText(st.name.toUpperCase()+(si===0?' (recepción)':''), x, 40);
    // slots de cola
    for(let i=0;i<MAX_QUEUE;i++){
      const p = queuePos(si,i);
      ctx.strokeStyle='rgba(148,163,184,.3)'; ctx.lineWidth=1.5; ctx.setLineDash([4,4]);
      roundRect(p.x-17,p.y-8,34,16,5); ctx.stroke(); ctx.setLineDash([]);
    }
    st.stations.forEach((s,k)=>drawStation(si,k,st.stations.length,s));
  });
  // carros (los de la cola primero, servidos encima)
  [...cars].sort((a,b)=>(a.state==='service'?1:0)-(b.state==='service'?1:0)).forEach(drawCar);
}

// ---------- Métricas DOM ----------
function renderUtilBars(){
  const c=document.getElementById('utilBars'); c.innerHTML='';
  stages.slice(1).forEach((st,i)=>{
    const d=document.createElement('div');
    d.innerHTML=`
      <div class="flex justify-between text-sm mb-1">
        <span class="font-semibold">${st.name} <span class="text-slate-400 font-normal">(${st.stations.length} estación${st.stations.length>1?'es':''})</span></span>
        <span id="utilVal_${i+1}" class="font-bold text-sky-400">0%</span>
      </div>
      <div class="w-full bg-slate-800 rounded-full h-3">
        <div id="utilBar_${i+1}" class="h-3 rounded-full transition-all duration-300" style="width:0%; background:linear-gradient(90deg,#0ea5e9,#34d399)"></div>
      </div>`;
    c.appendChild(d);
  });
}
function paintMetrics(){
  mIncome.textContent='$'+income.toFixed(2);
  mInvoices.textContent=invoices;
  mLost.textContent=lost;
  lblClock.textContent=fmt(simTime);
  const inSys = cars.filter(c=>c.state!=='exit').length;
  mInSys.textContent=inSys;
  const avg = serviceTimes.length? serviceTimes.reduce((a,b)=>a+b,0)/serviceTimes.length : 0;
  mAvgT.innerHTML=avg.toFixed(1)+'<span class="text-sm"> min</span>';
  let best=-1,bestName='—';
  stages.slice(1).forEach((st,i)=>{
    let u=0; st.stations.forEach(s=>u+=s.activeTime/Math.max(simTime,0.001)); u/=st.stations.length;
    const p=Math.min(u*100,100);
    const bar=document.getElementById('utilBar_'+(i+1)), val=document.getElementById('utilVal_'+(i+1));
    if(bar){ bar.style.width=p.toFixed(1)+'%';
      bar.style.background = p>85?'#ef4444': p>65?'#facc15':'linear-gradient(90deg,#0ea5e9,#34d399)'; }
    if(val) val.textContent=p.toFixed(1)+'%';
    if(simTime>2 && p>best){best=p;bestName=st.name;}
  });
  mBtl.textContent = simTime>2? bestName : '—';
  mBtlPct.textContent = simTime>2? best.toFixed(1)+'% de utilización' : '—';
}

// ---------- Bucle ----------
let last=0;
function loop(ts){
  if(!last) last=ts;
  const dt=Math.min((ts-last)/1000, 0.05); last=ts;
  if(running && dt>0) step(dt*speed>0.2?0.2:dt*speed);
  draw(); paintMetrics();
  requestAnimationFrame(loop);
}

// ---------- Eventos ----------
btnStart.onclick=()=>{ running=!running;
  btnStart.textContent=running?'⏸ Pausar':'▶ Iniciar';
  btnStart.className=running?'px-5 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 font-bold text-white transition':'px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-white transition';};
btnReset.onclick=()=>{ running=false; btnStart.textContent='▶ Iniciar';
  btnStart.className='px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-white transition';
  simTime=0; nextArrival=0.5; income=0; invoices=0; lost=0; serviceTimes=[]; cars=[]; buildStages(); };
btnSlow.onclick=()=>{ speed=Math.max(0.25,speed/2); lblSpeed.textContent='×'+speed; };
btnFast.onclick=()=>{ speed=Math.min(32,speed*2); lblSpeed.textContent='×'+speed; };
inpLambda.oninput=()=>lblLambda.textContent=(+inpLambda.value).toFixed(1);
[selAspirado,selLavado,selSecado].forEach(s=>s.onchange=()=>buildStages());

resize(); buildStages();
requestAnimationFrame(loop);
</script>
</body>
</html>
